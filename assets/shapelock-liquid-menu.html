<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BounJam Liquid Controls 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* One dark stage; the 3D pause menu fills it. A small caption top-left, two view switches at the bottom. */
:root {
  --bg: #050409;
  --ink: #f6eef6;
  --ink-soft: #9fb8bc;
  --line: rgba(255, 255, 255, 0.14);
  --chip: rgba(255, 255, 255, 0.06);
  --chip-on: rgba(255, 255, 255, 0.92);
  --chip-on-ink: #120b16;
  --display: "Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.cap {
  position: fixed; top: 0; left: 0; max-width: 360px; pointer-events: none;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0 max(16px, env(safe-area-inset-left, 0px));
}
.cap h1 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0; letter-spacing: 0.01em; }
.cap p { margin: 4px 0 0; color: var(--ink-soft); font-weight: 700; font-size: 12.5px; line-height: 1.45; text-wrap: pretty; }
.cap kbd { font-family: var(--body); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
  padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); backdrop-filter: blur(8px); }
.seg span { font-size: 12px; font-weight: 800; color: var(--ink-soft); padding: 0 8px 0 10px; }
.seg button { font: 800 12.5px var(--body); color: var(--ink); background: none; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#err { position: fixed; inset: auto 16px 64px 16px; color: #ffb3c4; font-weight: 800; text-align: center; }
</style>

const GLSL_COMMON = `

// ------------------------------------------------------------------ studio environment (HDR cube, rendered once)
// Dark room. Lights sit where a calm front face does NOT see them, so calm liquid stays deep and clean;
// ripples and the rounded edges tilt the surface into them and break them into shards of colour.
const ENV_FRAG = `
  precision highp float; varying vec3 vD;
  float box(vec2 ae, vec4 r, float s) {
    vec2 lo = smoothstep(r.xz - s, r.xz + s, ae);
    vec2 hi = 1.0 - smoothstep(r.yw - s, r.yw + s, ae);
    return lo.x * lo.y * hi.x * hi.y;
  }
  void main() {
    vec3 d = normalize(vD);
    float a = atan(d.x, d.z);              // 0 = straight back toward the viewer
    float e = asin(clamp(d.y, -1.0, 1.0));
    vec2 ae = vec2(a, e);
    vec3 c = mix(vec3(0.004, 0.003, 0.009), vec3(0.016, 0.014, 0.04), smoothstep(-0.4, 1.0, d.y));
    // big key above: white with a lavender cast, cut by thin bars so reflections read as liquid chrome
    float bars = smoothstep(0.42, 0.5, abs(fract(a * 2.2) - 0.5));
    c += vec3(2.2, 2.2, 2.7) * box(ae, vec4(-0.85, 0.85, 0.66, 1.2), 0.04) * (1.0 - 0.75 * bars);
    // two small windows just above eye level: caught only by ripples
    c += vec3(1.3, 1.45, 2.3) * box(ae, vec4(-0.6, -0.14, 0.22, 0.46), 0.02);
    c += vec3(1.9, 1.2, 2.2) * box(ae, vec4(0.14, 0.6, 0.22, 0.46), 0.02);

    c += mix(vec3(0.25, 0.55, 3.2), vec3(1.4, 0.6, 3.0), smoothstep(-0.3, 0.8, e)) * box(ae, vec4(-1.7, -1.25, -0.35, 0.85), 0.05);
    c += mix(vec3(3.0, 1.5, 0.8), vec3(2.6, 1.9, 1.6), smoothstep(-0.3, 0.8, e)) * box(ae, vec4(1.25, 1.65, -0.3, 0.8), 0.05);   // warm peach (the game's accent)
    // faint magenta floor bounce
    c += vec3(0.02, 0.12, 0.13) * smoothstep(-0.1, -0.7, d.y);
    gl_FragColor = vec4(c, 1.0);
  }`;
const envRT = new THREE.WebGLCubeRenderTarget(512, { type: HF, format: THREE.RGBAFormat, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter });
{

// ------------------------------------------------------------------ wave simulation
const SIM_FRAG = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D state; uniform vec2 texel; uniform vec2 size; uniform float radius;
  uniform vec4 imp[4]; uniform float damp;
  ${GLSL_COMMON}
  void main() {
    vec2 p = (vUv - 0.5) * size;
    float inside = step(sdRound(p, size * 0.5, radius), -0.005);
    vec4 s = texture2D(state, vUv);
    float h = s.r, prev = s.g;
    float hl = texture2D(state, vUv - vec2(texel.x, 0.0)).r, hr = texture2D(state, vUv + vec2(texel.x, 0.0)).r;
    float hd = texture2D(state, vUv - vec2(0.0, texel.y)).r, hu = texture2D(state, vUv + vec2(0.0, texel.y)).r;
    float lap = hl + hr + hd + hu - 4.0 * h;
    float hn = h + (h - prev) * damp + 0.42 * lap;
    hn = mix(hn, (hl + hr + hd + hu) * 0.25, 0.012);
    for (int i = 0; i < 4; i++) {
      vec2 d = (vUv - imp[i].xy) * size;
      hn += imp[i].w * exp(-dot(d, d) / (imp[i].z * imp[i].z));
    }
    gl_FragColor = vec4(hn * inside, h * inside, 0.0, 1.0);
  }`;
class Sim {
  constructor(w, d, radius, rows) {
    this.h = rows; this.w = Math.min(720, Math.round(rows * w / d));
    this.a = makeRT(this.w, this.h); this.b = makeRT(this.w, this.h);
    [this.a, this.b].forEach(t => { renderer.setRenderTarget(t); renderer.clear(); });
    this.pass = fsPass(SIM_FRAG, {
      state: { value: null }, texel: { value: new THREE.Vector2(1 / this.w, 1 / this.h) },
      size: { value: new THREE.Vector2(w, d) }, radius: { value: radius },
      imp: { value: [0, 1, 2, 3].map(() => new THREE.Vector4()) }, damp: { value: 0.9985 }
    });
    this.pending = []; this.energy = 0;
  }
  get tex() { return this.a.texture; }
  impulse(u, v, r, s) { this.pending.push([u, v, r, s]); this.energy = Math.max(this.energy, Math.abs(s) * 60); }
  step(damp) {
    if (this.energy <= 0.0005 && this.pending.length === 0) return false;
    this.pass.mat.uniforms.damp.value = damp;
    for (let s = 0; s < 3; s++) {
      const imp = this.pass.mat.uniforms.imp.value;
      for (let i = 0; i < 4; i++) imp[i].set(0, 0, 0.1, 0);
      if (s === 0) this.pending.splice(0, 4).forEach((q, i) => imp[i].set(q[0], q[1], q[2], q[3]));
      this.pass.mat.uniforms.state.value = this.a.texture;
      this.pass.render(this.b);
      const t = this.a; this.a = this.b; this.b = t;
    }

  }

// ------------------------------------------------------------------ geometry: a thick rounded slab with a soft, elliptical edge
function outline(w, d, r, n) {
  const a = w / 2, b = d / 2; r = Math.min(r, a, b);
  const segs = [];
  const L = (x0, y0, x1, y1, nx, ny) => segs.push({ k: 0, x0, y0, x1, y1, nx, ny, len: Math.hypot(x1 - x0, y1 - y0) });
  const A = (cx, cy, t0) => segs.push({ k: 1, cx, cy, t0, len: r * Math.PI / 2 });
  L(-a + r, -b, a - r, -b, 0, -1); A(a - r, -b + r, -Math.PI / 2);
  L(a, -b + r, a, b - r, 1, 0);    A(a - r, b - r, 0);
  L(a - r, b, -a + r, b, 0, 1);    A(-a + r, b - r, Math.PI / 2);
  L(-a, b - r, -a, -b + r, -1, 0); A(-a + r, -b + r, Math.PI);
  const total = segs.reduce((s, g) => s + g.len, 0), pts = [];
  for (let i = 0; i < n; i++) {
    let s = i / n * total;
    for (let j = 0; j < segs.length; j++) {
      const g = segs[j];
      if (s <= g.len || j === segs.length - 1) {
        const t = g.len > 0 ? Math.min(1, s / g.len) : 0;
        if (g.k === 0) pts.push([g.x0 + (g.x1 - g.x0) * t, g.y0 + (g.y1 - g.y0) * t, g.nx, g.ny]);
        else { const an = g.t0 + t * Math.PI / 2; pts.push([g.cx + Math.cos(an) * r, g.cy + Math.sin(an) * r, Math.cos(an), Math.sin(an)]); }
        break;
      }
      s -= g.len;
    }
  }
  return pts;
}
// edge band: from the back rim (phi 0) round the side to the front rim (phi pi); the front cap is a separate grid
function rimGeometry(w, d, r, Rb, T, nOut, nPhi) {
  const inner = outline(w - 2 * Rb, d - 2 * Rb, Math.max(0.001, r - Rb), nOut);
  const pos = [], nor = [], idx = [];
  for (let i = 0; i <= nOut; i++) {
    const [x, y, nx, ny] = inner[i % nOut];
    for (let j = 0; j <= nPhi; j++) {
      const ph = j / nPhi * Math.PI, s = Math.sin(ph), c = Math.cos(ph);
      pos.push(x + nx * Rb * s, y + ny * Rb * s, -T * c);
      let rn = T * s, zn = -Rb * c; const l = Math.hypot(rn, zn) || 1; rn /= l; zn /= l;
      nor.push(nx * rn, ny * rn, zn);
    }
  }
  for (let i = 0; i < nOut; i++) for (let j = 0; j < nPhi; j++) {
    const a = i * (nPhi + 1) + j, b = (i + 1) * (nPhi + 1) + j;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}

// ------------------------------------------------------------------ the liquid / glass material
const OBJ_VERT = `

  varying vec2 vUv; varying vec3 vW; varying vec3 vNo; varying vec3 vPo; varying vec3 vAx; varying vec3 vAy; varying vec3 vAz;

  void main() {

  #ifdef CAP

const OBJ_FRAG = `
  precision highp float;
  uniform sampler2D sim, back, backBlur, label, glow; uniform samplerCube env;
  uniform vec2 size, texel, res; uniform vec3 innerB, core, rim, absorb, milk, glassTint, glassEdge;
  uniform float T, gradK, liqC, liqHalf, glassAll, labelOn, labelFade, hover, solid, fade, iri, glowK, ledK, frostAmt, refrK;
  uniform float fill, drain, seed;
  #ifdef PANEL
  uniform vec4 spillR[3]; uniform vec4 spillC[3];
  #endif
  varying vec2 vUv; varying vec3 vW; varying vec3 vNo; varying vec3 vPo; varying vec3 vAx; varying vec3 vAy; varying vec3 vAz;
  ${GLSL_COMMON}
  float fingers(float u) {
    float a = sin(u * 17.0 + seed * 3.1) * 0.5 + 0.5, b = sin(u * 29.0 + seed * 7.7) * 0.5 + 0.5, c = sin(u * 7.0 + seed * 1.3) * 0.5 + 0.5;
    return pow(a, 6.0) * 0.7 + pow(b, 10.0) * 0.5 + c * 0.25;
  }
  void main() {
  #ifdef CAP
    if (sdRound(vPo.xy, innerB.xy, innerB.z) > 0.025) discard;      // overlaps the edge band: no seam
  #endif
    float men = 0.0;
  #ifdef PANEL
    // pour in from the top / drain away downward (same maths as UILiquidMorph)
    float u = clamp(vUv.x, 0.0, 1.0), vT = 1.0 - vUv.y, m = 1.0;
    if (fill < 0.9995) {
      float mn = 1.0 - 0.12 * (1.0 - sin(u * 3.14159)) * (1.0 - fill);
      float frontL = min(1.08, fill * 1.25 * mn * (1.0 + 0.30 * fingers(u) * (1.0 - fill)));
      float spread = mix(0.30, 1.04, smoothstep(0.0, 1.0, fill / 0.6));
      m = min(frontL - vT, (spread - abs(u - 0.5) * 2.0) * 0.5);
    }
    if (drain > 0.0005) {
      float roll = sin(u * 6.0 + seed * 2.3) * 0.5 + 0.5;
      float topL = clamp(drain * 1.12 - 0.14 * roll * sin(drain * 3.14159), 0.0, 1.02);
      float spread = mix(1.04, 0.32, smoothstep(0.45, 1.0, drain));
      m = min(m, min(vT - topL, (spread - abs(u - 0.5) * 2.0) * 0.5));
    }
    if (m < 0.0) discard;
    men = smoothstep(0.03, 0.0, m) * step(0.0005, (1.0 - fill) + drain);
  #endif
    float h = texture2D(sim, vUv).r;
    float hl = texture2D(sim, vUv - vec2(texel.x, 0.0)).r, hr = texture2D(sim, vUv + vec2(texel.x, 0.0)).r;
    float hd = texture2D(sim, vUv - vec2(0.0, texel.y)).r, hu = texture2D(sim, vUv + vec2(0.0, texel.y)).r;
    vec2 g = vec2(hr - hl, hu - hd) * gradK;
    float lap = hl + hr + hd + hu - 4.0 * h;
    vec3 n0 = normalize(vNo);
    vec3 nObj = normalize(n0 - vec3(g, 0.0) * clamp(n0.z, 0.0, 1.0));     // ripples run over the rounded edge too
    vec3 N = normalize(vAx * nObj.x + vAy * nObj.y + vAz * nObj.z);
    vec3 V = normalize(cameraPosition - vW);
    float ndv = clamp(dot(N, V), 0.0, 1.0);
    vec2 suv = gl_FragCoord.xy / res;
    vec3 Nv = normalize((viewMatrix * vec4(N, 0.0)).xyz);

    // which part is liquid and which is clear glass (the switch)
    float glass = max(glassAll, smoothstep(liqHalf - 0.012, liqHalf + 0.012, abs(vUv.x - liqC) + h * 0.03));
    float th = 2.0 * T * mix(0.25, 1.0, ndv);                              // path length through the body
    // what is behind, bent by the surface; RGB split a little = the rainbow fringe of real glass
    vec2 off = -Nv.xy * refrK * (0.6 + th);
    vec3 bk;
    bk.r = texture2D(back, suv + off).r;
    bk.g = texture2D(back, suv + off * 1.12).g;
    bk.b = texture2D(back, suv + off * 1.26).b;
    float frost = max(frostAmt, solid * (1.0 - glass) * 0.9);
    bk = mix(bk, texture2D(backBlur, suv + off * 1.2).rgb, frost);

    // liquid: coloured by absorption, plus a soft inner glow (brighter where it is thin)
    float thin = pow(1.0 - ndv, 1.5);
    vec3 liq = bk * exp(-absorb * th) * 1.7;
    vec3 emi = mix(core, rim, thin * 0.8) * glowK;
    emi *= (0.85 + 0.25 * smoothstep(0.3, -0.9, nObj.y)) * mix(0.78, 1.0, thin);   // clearer in the middle, glowing at the edges
    float caustic = max(-lap - 0.006, 0.0) * 14.0 * (1.0 - solid);
    emi += mix(rim, vec3(1.0, 0.9, 0.95), 0.4) * min(caustic, 1.0) * 0.55;
    liq += emi;
    liq = mix(liq, liq * vec3(0.8, 0.85, 1.0) + vec3(0.07, 0.09, 0.12), solid * 0.6);    // frozen: cooler, frosted
    vec3 gls = bk * glassTint + milk + glassEdge * thin * 0.3;
    vec3 col = mix(liq, gls, glass);

    // reflections of the studio, with a faint thin-film colour shift
    vec3 R = reflect(-V, N);
    vec3 rc = textureCube(env, R, frost * 3.5).rgb;
    vec3 film = 0.5 + 0.5 * cos(6.2832 * (vec3(0.0, 0.33, 0.67) + ndv * 1.2 + h * 1.5 + 0.1));
    rc *= mix(vec3(1.0), film * 1.35, iri);
    float fr = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
    col += rc * (fr + 0.03);
    col += vec3(0.75, 0.88, 1.15) * men * 0.7;
    col += rim * hover * 0.05;

  #ifdef PANEL
  #ifdef CAP
    // coloured light from the buttons spilling onto the glass under them
    for (int i = 0; i < 3; i++) {
      float s = sdRound(vPo.xy - spillR[i].xy, spillR[i].zw, spillR[i].w);
      col += spillC[i].rgb * exp(-max(s, 0.0) / 0.32) * spillC[i].a;
    }
  #endif
  #endif
    if (labelOn > 0.5 && n0.z > 0.0) {
      // LED text: sits a little inside the body (parallax), barely bent by ripples so it stays sharp
      vec3 Vo = vec3(dot(V, vAx), dot(V, vAy), dot(V, vAz));
      vec2 luv = vUv - Vo.xy / max(Vo.z, 0.35) * (T * 0.45) / size - nObj.xy * 0.006;
      float t = texture2D(label, luv).a * labelFade;
      float gw = texture2D(glow, luv).a * labelFade;
      col = mix(col, vec3(1.0, 0.975, 1.0) * ledK, t) + mix(rim, vec3(1.0), 0.55) * gw * 0.26;
    }
    col = mix(texture2D(back, suv).rgb, col, fade);
    gl_FragColor = vec4(col, 1.0);
  }`;

const resU = { value: new THREE.Vector2(1, 1) };
const uSolid = { value: 0 };
const backU = { value: null }, backBlurU = { value: null };          // the layer behind the controls
const bgU = { value: null }, bgBlurU = { value: null };              // the layer behind the panel

// ------------------------------------------------------------------ palette (the game's own colours): turquoise / mint liquid, icy glass, dark stage

    { core: "#0fb5a6", rim: "#8af7e2", absorb: [2.6, 0.32, 0.55] },   // primary: turquoise
    { core: "#0fa7b8", rim: "#86ecf5", absorb: [2.8, 0.45, 0.4] },    // cyan-turquoise
    { core: "#1592b8", rim: "#8ad8f7", absorb: [2.9, 0.7, 0.3] }      // aqua blue
  ],
  glassTint: [0.86, 0.95, 1.0],      // icy glass: what is behind, slightly cooled
  glassEdge: [0.4, 0.9, 1.0],        // cyan light gathering at the thin edges

  glassRim: "#8fe9ff"

function makeUniforms(o) {
  const c = k => new THREE.Color(k);
  return {
    sim: { value: zeroTex }, back: o.back || backU, backBlur: o.backBlur || backBlurU, label: { value: zeroTex }, glow: { value: zeroTex },
    env: { value: envRT.texture }, res: resU, solid: o.noSolid ? { value: 0 } : uSolid,
    size: { value: new THREE.Vector2(o.w || 1, o.d || 1) }, texel: { value: new THREE.Vector2(1, 1) },
    innerB: { value: new THREE.Vector3(1, 1, 0.1) }, T: { value: o.T || 0.1 }, amp: { value: 0.03 }, gradK: { value: o.gradK || 6 },
    liqC: { value: o.liqC == null ? 0.5 : o.liqC }, liqHalf: { value: o.liqHalf == null ? 2 : o.liqHalf }, glassAll: { value: o.glass ? 1 : 0 },
    labelOn: { value: 0 }, labelFade: { value: 1 }, hover: { value: 0 }, fade: { value: 1 },
    iri: { value: o.iri == null ? 0.3 : o.iri }, glowK: { value: o.glowK == null ? 0.4 : o.glowK }, ledK: { value: 1.45 },
    frostAmt: { value: o.frost || 0 }, refrK: { value: o.refrK || 0.02 },
    core: { value: c(o.core || PAL.liquid[0].core) }, rim: { value: c(o.rim || PAL.liquid[0].rim) },
    absorb: { value: new THREE.Vector3(...(o.absorb || PAL.liquid[0].absorb)) }, milk: { value: new THREE.Vector3(...(o.milk || [0, 0, 0])) },
    glassTint: { value: new THREE.Vector3(...(o.glassTint || PAL.glassTint)) }, glassEdge: { value: new THREE.Vector3(...PAL.glassEdge) },
    fill: { value: 1 }, drain: { value: 0 }, seed: { value: 1.7 },

}

// ------------------------------------------------------------------ text: crisp layer + soft glow layer
function labelTextures(w, d, items) {
  const W = 2048, H = Math.round(W * d / w);
  const crisp = document.createElement("canvas"); crisp.width = W; crisp.height = H;
  const soft = document.createElement("canvas"); soft.width = W / 2; soft.height = Math.round(H / 2);
  const gc = crisp.getContext("2d"), gs = soft.getContext("2d");
  for (const it of items) {
    const px = Math.round(H * it.size), font = `${it.weight || 600} ${px}px Fredoka, Nunito, sans-serif`;
    const x = W * (it.x == null ? 0.5 : it.x), y = H * (it.y == null ? 0.5 : it.y);
    gc.font = font; gc.textAlign = "center"; gc.textBaseline = "middle"; gc.fillStyle = "#fff";
    gc.globalAlpha = it.alpha == null ? 1 : it.alpha;
    gc.fillText(it.text, x, y);
    // glow: draw only the shadow (text far off-canvas, shadow shifted back in)
    gs.font = `${it.weight || 600} ${Math.round(px / 2)}px Fredoka, Nunito, sans-serif`; gs.textAlign = "center"; gs.textBaseline = "middle";
    gs.fillStyle = "#fff"; gs.shadowColor = "#fff"; gs.shadowBlur = px * 0.18; gs.shadowOffsetX = W * 4;
    gs.globalAlpha = (it.alpha == null ? 1 : it.alpha) * 0.9;
    gs.fillText(it.text, x / 2 - W * 4, y / 2);
  }
  const t1 = new THREE.CanvasTexture(crisp), t2 = new THREE.CanvasTexture(soft);
  t1.anisotropy = renderer.capabilities.getMaxAnisotropy(); t1.generateMipmaps = true; t1.minFilter = THREE.LinearMipmapLinearFilter;
  return [t1, t2];
}

// ------------------------------------------------------------------ a liquid slab (button, switch, panel)
const scenes = { back: new THREE.Scene(), main: new THREE.Scene() };
const slabs = [];
class Slab {
  constructor(o) {
    Object.assign(this, { w: o.w, d: o.d, r: o.r, Rb: o.Rb, T: o.T });
    this.group = new THREE.Group(); this.inner = new THREE.Group(); this.group.add(this.inner);
    this.sim = new Sim(o.w, o.d, o.r, o.rows || 160);
    const U = this.U = makeUniforms(o);
    U.sim.value = this.sim.tex;
    U.texel.value.set(1 / this.sim.w, 1 / this.sim.h);
    U.innerB.value.set(o.w / 2 - o.Rb, o.d / 2 - o.Rb, Math.max(0.001, o.r - o.Rb));
    const defs = o.panel ? { PANEL: "" } : {};
    const capGeo = new THREE.PlaneBufferGeometry(o.w - 2 * o.Rb + 0.06, o.d - 2 * o.Rb + 0.06, Math.round(this.sim.w * 0.6), Math.round(this.sim.h * 0.6));
    this.cap = new THREE.Mesh(capGeo, objMaterial(U, Object.assign({ CAP: "" }, defs)));
    this.rim = new THREE.Mesh(rimGeometry(o.w, o.d, o.r, o.Rb, o.T, 240, 22), objMaterial(U, defs));
    this.inner.add(this.cap, this.rim);
    this.pick = new THREE.Mesh(new THREE.PlaneBufferGeometry(o.w, o.d), new THREE.MeshBasicMaterial());
    this.pick.position.z = o.T; this.pick.visible = false; this.pick.userData.slab = this;
    this.inner.add(this.pick);
    this.liquid = !o.glass; this.onPress = o.onPress || null; this.enabled = true;
    this.lift = 0; this.liftV = 0; this.sq = 1; this.sqV = 0; this.hoverT = 0; this.hovering = false;
    this.pop = 1; this.popV = 0;
    (o.panel ? scenes.back : scenes.main).add(this.group);
    slabs.push(this);
  }
  setLabel(items) {
    const [a, b] = labelTextures(this.w, this.d, items);
    if (this.U.label.value !== zeroTex) { this.U.label.value.dispose(); this.U.glow.value.dispose(); }
    this.U.label.value = a; this.U.glow.value = b; this.U.labelOn.value = 1;
  }
  inside(uv) {
    const px = (uv.x - 0.5) * this.w, py = (uv.y - 0.5) * this.d;
    const qx = Math.abs(px) - this.w / 2 + this.r, qy = Math.abs(py) - this.d / 2 + this.r;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - this.r < 0;
  }
  step(dt) {
    const kS = 260, kD = 12, h = dt / 4;
    for (let i = 0; i < 4; i++) {
      this.liftV += ((this.hovering ? 1 : 0) - this.lift) * kS * h - this.liftV * kD * h; this.lift += this.liftV * h;
      this.sqV += (1 - this.sq) * kS * h - this.sqV * kD * h; this.sq += this.sqV * h;
    }
    this.hoverT += ((this.hovering ? 1 : 0) - this.hoverT) * Math.min(1, dt * 8);
    this.U.hover.value = this.hoverT;
    const s = 1 - this.sq;
    this.inner.position.z = this.lift * 0.14 - s * 0.35;
    this.inner.scale.set(1 + s * 0.06 + this.lift * 0.012, 1 + s * 0.1 + this.lift * 0.012, Math.max(0.3, 1 - s * 0.9));
    const damp = this.liquid ? 0.9985 - uSolid.value * 0.1 : 0.997;
    if (this.sim.step(damp)) this.U.sim.value = this.sim.tex;
  }
}

  precision highp float; varying vec2 vUv;
  uniform float time, mode; uniform vec2 res; uniform sampler2D game;
  void main() {
    float asp = res.x / res.y;
    vec2 p = (vUv - 0.5) * vec2(asp, 1.0);

  panel.setLabel([
    { text: "Duraklatıldı", y: 0.095, size: 0.078, weight: 600 },
    { text: "Bölüm 1 · Kağıt İskele · 3 / 5 damla", y: 0.165, size: 0.03, weight: 500, alpha: 0.6 }
  ]);
  drawToggle();
}
drawLabels();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(drawLabels);

// ------------------------------------------------------------------ panel open / close (pour in, drain away)
const contents = buttons;                      // pop in after the glass has poured
const P_ST = { mode: "open", e: 0, dropped: false, after: null, pourT: 0 };
const easeOut = k => { k = Math.min(Math.max(k, 0), 1); return 1 - Math.pow(1 - k, 3); };
const easeInOut = k => { k = Math.min(Math.max(k, 0), 1); return k * k * (3 - 2 * k); };
function fingers(u, seed) {
  const a = Math.sin(u * 17 + seed * 3.1) * 0.5 + 0.5, b = Math.sin(u * 29 + seed * 7.7) * 0.5 + 0.5, c = Math.sin(u * 7 + seed * 1.3) * 0.5 + 0.5;
  return Math.pow(a, 6) * 0.7 + Math.pow(b, 10) * 0.5 + c * 0.25;
}
function openPanel() {
  if (P_ST.mode === "open" || P_ST.mode === "opening") return;
  Object.assign(P_ST, { mode: "opening", e: 0, pourT: 0 });
  panel.U.seed.value = Math.random() * 10; panel.U.fill.value = 0; panel.U.drain.value = 0; panel.U.fade.value = 1; panel.U.labelFade.value = 0;
  panel.group.visible = true;
  contents.forEach(b => { b.group.visible = true; b.U.fade.value = 0; b.pop = 0.6; b.popV = 0; b.popped = false; b.enabled = false; });
  hint(false);
}
function closePanel(after) {
  if (P_ST.mode !== "open") return;
  Object.assign(P_ST, { mode: "closing", e: 0, dropped: false, after: after || null });
  panel.U.seed.value = Math.random() * 10;
  contents.forEach(b => { b.enabled = false; b.hovering = false; });
}
function updatePanel(dt) {
  const U = panel.U;
  if (P_ST.mode === "opening") {
    const e = (P_ST.e += dt);
    U.fill.value = easeOut(e / 0.75);
    // the pour itself makes waves: pushes along the falling front
    P_ST.pourT -= dt;
    if (P_ST.pourT <= 0 && U.fill.value < 0.98) {
      P_ST.pourT = 0.05;
      const f = U.fill.value, spread = 0.3 + 0.7 * easeInOut(f / 0.6);
      panel.sim.impulse(0.5 + (Math.random() - 0.5) * spread * 0.9, 1 - Math.min(1, f * 1.15), 0.22, 0.1);
    }
    U.labelFade.value = Math.min(1, Math.max(0, (e - 0.4) / 0.2));
    contents.forEach((b, i) => {
      const st = 0.45 + 0.07 * i;
      if (e < st) return;
      if (!b.popped) { b.popped = true; b.pop = 0.6; b.popV = 0; b.sim.impulse(0.5, 0.5, 0.2, 0.6); }
      b.U.fade.value = Math.min(1, (e - st) / 0.14);
    });
    if (e > 1.5) { P_ST.mode = "open"; U.fill.value = 1; contents.forEach(b => { b.U.fade.value = 1; b.enabled = true; }); }
  } else if (P_ST.mode === "closing") {
    const e = (P_ST.e += dt), n = contents.length;
    contents.forEach((b, i) => {
      const k = Math.min(1, Math.max(0, (e - 0.03 * (n - 1 - i)) / 0.16));
      b.U.fade.value = 1 - k; b.pop = 1 - 0.18 * k;
    });
    U.labelFade.value = Math.max(0, 1 - e / 0.16);
    const raw = Math.min(1, Math.max(0, (e - 0.1) / 0.85));
    const d = 0.5 - 0.5 * Math.cos(raw * Math.PI);
    U.drain.value = d;
    U.fade.value = 1 - easeInOut((raw - 0.55) / 0.45);
    if (!P_ST.dropped && raw >= 0.62) { P_ST.dropped = true; releaseDrops(U.seed.value, d); }
    if (raw >= 1) {
      P_ST.mode = "closed"; panel.group.visible = false; U.drain.value = 0;
      contents.forEach(b => { b.group.visible = false; });
      const cb = P_ST.after; P_ST.after = null;
      if (cb) cb(); else hint(true);
    }
  }
  contents.forEach(b => {
    if (P_ST.mode === "opening" && b.popped) {
      const h = dt / 4;
      for (let i = 0; i < 4; i++) { b.popV += ((1 - b.pop) * 260 - b.popV * 12) * h; b.pop += b.popV * h; }
    }
    b.group.scale.setScalar(b.pop);
  });
}
function releaseDrops(seed, drain) {
  const spread = 1 + (0.32 - 1) * easeInOut((drain - 0.45) / 0.55);
  let n = 0;
  for (let i = 1; i < 47 && n < 6; i++) {
    const u = i / 48, f = fingers(u, seed);
    if (f < 0.55 || f < fingers(u - 1 / 48, seed) || f < fingers(u + 1 / 48, seed)) continue;
    spawnDrop((u - 0.5) * PANEL.w * spread, PANEL.y - PANEL.d / 2 - 0.05, 0.07 + 0.07 * f);
    n++;
  }
}
const hintEl = document.getElementById("hint");
const hintOpen = hintEl.innerHTML;
function hint(closed) {
  hintEl.innerHTML = closed ? "Menü akıp gitti. Tekrar açmak için tıkla ya da <kbd>Esc</kbd>." : hintOpen;
}

// ------------------------------------------------------------------ actions
let liqTarget = 0.27, liqV = 0;
function setSolid(on) {
  if (on === solidMode) return;
  solidMode = on; drawToggle();
  const from = on ? 0.2 : 0.8, to = on ? 0.8 : 0.2;
  for (let i = 0; i < 4; i++) setTimeout(() => toggle.sim.impulse(from + (to - from) * i / 3, 0.5, 0.3, (on ? 1 : -1) * 0.28), i * 70);
  liqTarget = on ? 0.73 : 0.27;
}
toggle.onPress = () => setSolid(!solidMode);
buttons[0].onPress = () => setTimeout(() => closePanel(), 140);
buttons[1].onPress = () => setTimeout(() => closePanel(() => setTimeout(openPanel, 250)), 140);
buttons[2].onPress = () => {};
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); setSolid(!solidMode); }
  if (e.code === "Escape") { if (P_ST.mode === "closed") openPanel(); else closePanel(); }
});

// ------------------------------------------------------------------ pointer
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const cursorPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -1.9);
let hovered = null, lastHit = null;
function setRay(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function pick() {
  const list = slabs.filter(s => s.group.visible && (s !== panel || P_ST.mode === "open") && (s === panel || s === toggle || s.enabled)).map(s => s.pick);
  for (const h of ray.intersectObjects(list, false)) {
    const s = h.object.userData.slab;
    if (s.inside(h.uv)) return { s, uv: h.uv };
  }
  return null;
}
canvas.addEventListener("pointermove", e => {
  setRay(e);
  const p = new THREE.Vector3();
  if (ray.ray.intersectPlane(cursorPlane, p)) { cursor.target.copy(p); cursor.seen = true; }
  const hit = pick();
  if (hovered && (!hit || hit.s !== hovered)) hovered.hovering = false;
  hovered = hit ? hit.s : null;
  if (hit && hit.s !== panel) hit.s.hovering = true;
  if (hit && lastHit && lastHit.s === hit.s) {
    const dx = hit.uv.x - lastHit.uv.x, dy = hit.uv.y - lastHit.uv.y;
    const sp = Math.hypot(dx * hit.s.w, dy * hit.s.d);
    if (sp > 0.004 && !(solidMode && hit.s.liquid && hit.s !== toggle)) hit.s.sim.impulse(hit.uv.x, hit.uv.y, 0.06, Math.min(0.07, sp * 0.5));
  }
  lastHit = hit;
  canvas.style.cursor = cursor.on && e.pointerType === "mouse" ? "none" : (hit && hit.s !== panel ? "pointer" : "default");
});
canvas.addEventListener("pointerleave", () => { if (hovered) hovered.hovering = false; hovered = null; lastHit = null; cursor.seen = false; });
canvas.addEventListener("pointerdown", e => {
  setRay(e);
  if (P_ST.mode === "closed") { openPanel(); return; }
  const hit = pick();
  if (!hit) return;
  const s = hit.s;
  const k = solidMode && s.liquid && s !== toggle ? 0.12 : 1.0;
  s.sim.impulse(hit.uv.x, hit.uv.y, 0.06, 1.25 * k * (s === panel ? 0.5 : 1));
  s.sim.impulse(hit.uv.x, hit.uv.y, 0.14, -0.5 * k * (s === panel ? 0.5 : 1));
  if (s !== panel) s.sqV -= 2.2;
  if (s.onPress) s.onPress();
});
document.querySelectorAll("[data-bg]").forEach(b => b.addEventListener("click", () => {
  bgMode.value = +b.dataset.bg;
  document.querySelectorAll("[data-bg]").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
document.querySelectorAll("[data-cur]").forEach(b => b.addEventListener("click", () => {
  cursor.on = b.dataset.cur === "1";
  document.querySelectorAll("[data-cur]").forEach(x => x.setAttribute("aria-pressed", x === b));
  canvas.style.cursor = "default";
}));

// ------------------------------------------------------------------ passes
scenes.back.add(backdropMesh(bgU));
scenes.main.add(backdropMesh(backU));
const blur = fsPass(`precision highp float; varying vec2 vUv; uniform sampler2D src; uniform vec2 dir;
  void main(){ vec3 c = texture2D(src, vUv).rgb * 0.227;
    c += (texture2D(src, vUv + dir * 1.385).rgb + texture2D(src, vUv - dir * 1.385).rgb) * 0.316;
    c += (texture2D(src, vUv + dir * 3.231).rgb + texture2D(src, vUv - dir * 3.231).rgb) * 0.070;
    gl_FragColor = vec4(c, 1.0); }`, { src: { value: null }, dir: { value: new THREE.Vector2() } });
const bright = fsPass(`precision highp float; varying vec2 vUv; uniform sampler2D src;
  void main(){ vec3 c = texture2D(src, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(1.05, 2.4, l), 1.0); }`, { src: { value: null } });
const comp = fsPass(`precision highp float; varying vec2 vUv; uniform sampler2D src, bloom; uniform vec2 res;
  vec3 shoulder(vec3 c) {               // identity up to 0.78, then rolls smoothly into white (no grey cast)
    const float k = 0.78;
    vec3 over = max(c - k, 0.0);
    return min(c, vec3(k)) + (1.0 - k) * (1.0 - exp(-over / (1.0 - k)));
  }
  void main(){
    vec3 c = texture2D(src, vUv).rgb + texture2D(bloom, vUv).rgb * 0.38;
    c = shoulder(c);
    vec2 p = vUv - 0.5; p.x *= res.x / res.y;
    c *= 1.0 - 0.18 * dot(p, p);
    gl_FragColor = vec4(c, 1.0);
  }`, { src: { value: null }, bloom: { value: null }, res: resU });
function blurInto(src, dst, tmp, iters) {
  for (let i = 0; i < iters; i++) {
    blur.mat.uniforms.src.value = i === 0 ? src.texture : dst.texture; blur.mat.uniforms.dir.value.set((1 + i) / dst.width, 0); blur.render(tmp);
    blur.mat.uniforms.src.value = tmp.texture; blur.mat.uniforms.dir.value.set(0, (1 + i) / dst.height); blur.render(dst);
  }
}

let rt = {};
function resize() {
  const W = canvas.clientWidth, H = canvas.clientHeight, pr = renderer.getPixelRatio();
  renderer.setSize(W, H, false);
  const w = Math.round(W * pr), h = Math.round(H * pr);
  resU.value.set(w, h);
  camera.aspect = W / H;
  // fit the menu (about 7.6 wide, 9.6 tall) on any screen shape
  const visH = Math.max(10.2, 7.6 / camera.aspect);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(visH / 2 / Math.hypot(CAM_D, CAM_Y)));
  camera.updateProjectionMatrix();
  Object.values(rt).forEach(t => t.dispose());
  const q = (k) => [Math.max(1, Math.round(w / k)), Math.max(1, Math.round(h / k))];
  rt = {
    bg: makeRT(w, h), bgBlur: makeRT(...q(4)), bgTmp: makeRT(...q(4)),
    back: makeRT(w, h, { depthBuffer: true }), backBlur: makeRT(...q(4)), backTmp: makeRT(...q(4)),
    scene: makeSceneRT(w, h), bloomA: makeRT(...q(4)), bloomB: makeRT(...q(4))
  };
  bgU.value = rt.bg.texture; bgBlurU.value = rt.bgBlur.texture;
  backU.value = rt.back.texture; backBlurU.value = rt.backBlur.texture;
}
addEventListener("resize", resize);
resize();

// ------------------------------------------------------------------ loop
let last = performance.now(), idleT = 0.6;
function frame(now, fixedDt) {
  const dt = fixedDt || Math.min(0.05, (now - last) / 1000); last = now;
  uTime.value += dt;
  uSolid.value += ((solidMode ? 1 : 0) - uSolid.value) * Math.min(1, dt * 4);
  const lc = toggle.U.liqC;
  liqV += ((liqTarget - lc.value) * 140 - liqV * 7) * dt; lc.value += liqV * dt;

  // a living surface: a constant faint shimmer, and now and then a soft drop (liquid mode only)
  if (!reduceMotion && !solidMode) {
    for (const s of [...buttons, toggle]) if (s.group.visible && Math.random() < 0.45) s.sim.impulse(Math.random(), 0.15 + Math.random() * 0.7, 0.07, (Math.random() - 0.5) * 0.06);
    idleT -= dt;
    if (idleT <= 0) { idleT = 1.8 + Math.random() * 2.2; const s = [...buttons, toggle][Math.floor(Math.random() * 4)]; if (s.group.visible) s.sim.impulse(0.15 + Math.random() * 0.7, 0.3 + Math.random() * 0.4, 0.06, 0.22); }
  }
  updatePanel(dt);
  slabs.forEach(s => s.step(dt));
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i]; d.life += dt; d.vy -= 13 * dt;
    d.mesh.position.y += d.vy * dt;
    const st = Math.min(1.8, 1 + Math.abs(d.vy) * 0.06);
    d.mesh.scale.set(d.r / Math.sqrt(st), d.r * st, d.r / Math.sqrt(st));
    d.U.fade.value = Math.min(1, d.life / 0.12) * (1 - easeInOut((d.life - 0.35) / 0.4));
    if (d.life > 0.8) { scenes.main.remove(d.mesh); d.mesh.material.dispose(); drops.splice(i, 1); }
  }
  cursor.grp.visible = cursor.on && cursor.seen;
  cursor.grp.position.lerp(cursor.target, Math.min(1, dt * 28));

  // 1 background -> 2 panel over it -> 3 controls over that (each layer refracts the one behind) -> bloom
  bgPass.render(rt.bg);
  blurInto(rt.bg, rt.bgBlur, rt.bgTmp, 3);
  renderer.setRenderTarget(rt.back); renderer.render(scenes.back, camera);
  blurInto(rt.back, rt.backBlur, rt.backTmp, 2);
  renderer.setRenderTarget(rt.scene); renderer.render(scenes.main, camera);
  bright.mat.uniforms.src.value = rt.scene.texture; bright.render(rt.bloomA);
  blurInto(rt.bloomA, rt.bloomA, rt.bloomB, 3);
  comp.mat.uniforms.src.value = rt.scene.texture; comp.mat.uniforms.bloom.value = rt.bloomA.texture; comp.render(null);
  if (!fixedDt) requestAnimationFrame(frame);
}
// headless checks drive the loop by hand
if (window.__TEST) window.__advance = (n, dt) => { for (let i = 0; i < n; i++) frame(performance.now(), dt || 1 / 60); };
else requestAnimationFrame(frame);
window.__liquid = { slabs, buttons, toggle, panel, setSolid, openPanel, closePanel, cursor, bgMode };
})();
</script>
